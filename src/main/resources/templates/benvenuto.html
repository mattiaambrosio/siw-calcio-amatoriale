<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuto – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
        <div class="form-card form-card-wide anim-fade-up" style="text-align: center; max-width: 640px;">

            <!-- Icon -->
            <div style="font-size: 3.5rem; margin-bottom: 1.25rem; animation: fadeUp 0.5s ease both;">👋</div>

            <!-- Title -->
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">
                Benvenuto, <span style="color: var(--green);" th:text="${displayName}">Utente</span>!
            </h1>

            <!-- Role badge -->
            <div style="margin: 1rem 0 1.5rem;">
                <span class="badge badge-red" th:if="${isAdmin}">👑 Amministratore</span>
                <span class="badge badge-blue" th:unless="${isAdmin}">👤 Utente Registrato</span>
            </div>

            <p style="margin-bottom: 2rem; font-size: 0.95rem;">
                Accesso effettuato con successo. Scegli cosa fare:
            </p>

            <!-- Quick actions -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                <a href="/tornei"    class="btn btn-primary">🏆 Tornei</a>
                <a href="/partite"   class="btn btn-outline">📅 Partite</a>
                <a href="/squadre"   class="btn btn-outline">🛡️ Squadre</a>
                <a href="/dashboard" class="btn btn-outline">⚙️ Dashboard</a>
            </div>

            <!-- Admin extra -->
            <div th:if="${isAdmin}" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1rem;">Azioni Amministratore</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <a href="/admin/torneo/new"   class="btn btn-secondary btn-sm">+ Torneo</a>
                    <a href="/admin/squadra/new"  class="btn btn-secondary btn-sm">+ Squadra</a>
                    <a href="/admin/giocatore/new" class="btn btn-secondary btn-sm">+ Giocatore</a>
                    <a href="/admin/performance"  class="btn btn-secondary btn-sm">📊 Analisi JPA</a>
                </div>
            </div>

        </div>
    </main>
</body>
</html>

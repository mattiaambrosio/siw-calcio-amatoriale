<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="form-page">
        <div class="form-card form-card-wide anim-fade-up">

            <!-- Brand -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">⚽</div>
                <h1 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Crea il tuo account</h1>
                <p style="font-size: 0.875rem;">Unisciti alla community del calcio amatoriale.</p>
            </div>

            <!-- Google OAuth -->
            <a href="/oauth2/authorization/google" class="btn btn-google" style="width: 100%; padding: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Registrati con Google
            </a>

            <!-- Divider -->
            <div class="divider">oppure con email</div>

            <!-- Form -->
            <form th:action="@{/register}" th:object="${registrationForm}" method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" th:field="*{nome}"
                               required placeholder="Mario" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" th:field="*{cognome}"
                               required placeholder="Rossi" autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Indirizzo Email</label>
                    <input type="email" id="email" th:field="*{email}"
                           required placeholder="mario.rossi@esempio.it" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}"
                           required placeholder="Minimo 8 caratteri" autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                    Crea Account
                </button>
            </form>

            <!-- Footer -->
            <p style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
                Hai già un account?
                <a href="/login" style="color: var(--green); font-weight: 600;">Accedi</a>
            </p>
            <p style="text-align: center; margin-top: 0.5rem; font-size: 0.82rem;">
                <a href="/" style="color: var(--text-muted);">← Torna alla Home</a>
            </p>

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .auth-container {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: slideInLeft 0.6s ease-out;
        }
        .auth-container h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            color: var(--white-main);
        }
        .auth-container > p {
            margin: 0 0 1.5rem 0;
            color: var(--gray-medium);
            font-size: 0.95rem;
        }
        .form-section {
            margin-bottom: 1.5rem;
        }
        .form-section label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--white-main);
            font-size: 0.95rem;
            font-weight: 600;
        }
        .form-section input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--white-main);
            font-size: 0.95rem;
        }
        .form-section input:focus {
            outline: none;
            border-color: var(--pitch-green-light);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
            background: rgba(46, 204, 113, 0.02);
        }
        .form-section input::placeholder {
            color: var(--gray-medium);
        }
        .submit-btn {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background-color: var(--pitch-green-light);
            border: none;
            border-radius: 980px;
            color: #000000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(50, 215, 75, 0.3);
        }
        .submit-btn:hover {
            transform: scale(1.02);
            background-color: var(--pitch-green-bright);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            gap: 1rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .divider span {
            color: var(--gray-medium);
            font-size: 0.85rem;
        }
        .oauth-btn {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 980px;
            background-color: var(--google-blue);
            color: var(--white-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-bottom: 1rem;
        }
        .oauth-btn:hover {
            background-color: #3367D6;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        .footer-links p {
            margin: 0 0 0.75rem 0;
            color: var(--gray-medium);
            font-size: 0.9rem;
        }
        .footer-links a {
            color: var(--pitch-green-light);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .footer-links a:hover {
            color: var(--pitch-green-bright);
        }
        .back-home {
            display: inline-block;
            margin-top: 1rem;
            color: var(--gray-medium);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .back-home:hover {
            color: var(--pitch-green-light);
        }
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>⚽ Registrati</h1>
        <p>Crea un account per gestire i tuoi tornei.</p>

        <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}\"></div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-section">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="es. Luca" required />
            </div>

            <div class="form-section">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" th:field="*{cognome}" placeholder="es. Rossi" required />
            </div>

            <div class="form-section">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="es. luca@email.it" required />
            </div>

            <div class="form-section">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required />
            </div>

            <button type="submit" class="submit-btn">Registrati</button>
        </form>

        <div class="divider"><span>oppure</span></div>

        <a href="/oauth2/authorization/google" class="oauth-btn">⚽ Registrati con Google</a>

        <div class="footer-links">
            <p>Hai già un account? <a href="/login">Accedi qui</a></p>
            <a href="/" class="back-home">← Torna alla Home</a>
        </div>
    </div>
</body>
</html>

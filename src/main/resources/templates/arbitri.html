<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitri Registrati - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            margin-bottom: 0.5rem;
        }
        .referees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .referee-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .referee-card:hover {
            border-top-color: var(--pitch-green-light);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
            transform: translateY(-4px);
        }
        .referee-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white-main);
            margin: 0 0 1rem 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: var(--white-main);
        }
        .info-value {
            color: var(--gray-dark);
            text-align: right;
        }
        .badge-code {
            display: inline-block;
            background: var(--accent-purple);
            color: var(--white-main);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 1rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray-medium);
        }
        .empty-state h2 {
            color: var(--gray-dark);
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .referees-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
    <body>
    <div class="ambient-glow"></div>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre">Squadre</a></li>
            <li><a href="/giocatori">Giocatori</a></li>
            <li sec:authorize="isAuthenticated()"><a href="/dashboard">Area Personale</a></li>
        </ul>
    </nav>

    <main class="container">
        <header style="margin-bottom: 3rem;">
            <h1 class="text-gradient" style="font-size: 3rem;">Corpo Arbitrale</h1>
            <p style="color: var(--gray-medium);">I garanti del fair-play nei nostri tornei.</p>
        </header>

        <!-- Barra di ricerca -->
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
            <input type="text" id="searchArbitri" placeholder="🔍 Cerca un arbitro..." style="
                padding: 0.8rem 1.2rem;
                border-radius: 10px;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.1);
                color: #fff;
                font-size: 0.95rem;
                flex: 1;
                outline: none;
                transition: border-color 0.2s;
            " />
            <button id="clearSearchArbitri" style="display:none; padding: 0.8rem 1.2rem; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-weight: 600;">✕ Cancella</button>
        </div>

        <section class="glass-panel" style="padding: 1rem;">
            <table>
                <thead>
                    <tr>
                        <th>Arbitro</th>
                        <th>Sezione / Città</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${arbitri}">
                        <td>
                            <div style="display: flex; align-items: center; gap: 1rem;">
                                <div style="width: 35px; height: 35px; background: rgba(50,215,75,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-green); font-size: 0.8rem;">🏁</div>
                                <span style="color: #fff; font-weight: 600;" th:text="${a.nome} + ' ' + ${a.cognome}">Nome Cognome</span>
                            </div>
                        </td>
                        <td>
                            <span style="color: var(--gray-medium);" th:text="${a.sezione}">Sezione</span>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${#lists.isEmpty(arbitri)}" style="text-align: center; padding: 3rem;">
                <p style="color: var(--gray-medium);">Nessun arbitro registrato.</p>
                <a href="/admin/arbitro/new" sec:authorize="hasAuthority('ADMIN')" class="btn btn-primary" style="margin-top: 1rem;">+ Aggiungi Arbitro</a>
            </div>
        </section>
    </main>

    <script>
        // Ricerca in tempo reale per gli arbitri
        const searchInput = document.getElementById('searchArbitri');
        const clearBtn = document.getElementById('clearSearchArbitri');
        const rows = document.querySelectorAll('tbody tr');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            clearBtn.style.display = searchTerm ? 'block' : 'none';
            
            let visibleCount = 0;
            rows.forEach(row => {
                const nome = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
                const sezione = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
                const match = nome.includes(searchTerm) || sezione.includes(searchTerm);
                row.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            // Mostra messaggio se nessun arbitro trovato
            if (visibleCount === 0 && searchTerm) {
                if (!document.getElementById('noResults')) {
                    const msg = document.createElement('tr');
                    msg.id = 'noResults';
                    msg.innerHTML = '<td colspan="2" style="text-align: center; padding: 2rem; color: var(--gray-medium);">❌ Nessun arbitro trovato</td>';
                    document.querySelector('tbody').appendChild(msg);
                }
            } else {
                const noResults = document.getElementById('noResults');
                if (noResults) noResults.remove();
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitri Registrati - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            margin-bottom: 0.5rem;
        }
        .referees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .referee-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--accent-purple);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .referee-card:hover {
            border-top-color: var(--pitch-green-light);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
            transform: translateY(-4px);
        }
        .referee-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white-main);
            margin: 0 0 1rem 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: var(--white-main);
        }
        .info-value {
            color: var(--gray-dark);
            text-align: right;
        }
        .badge-code {
            display: inline-block;
            background: var(--accent-purple);
            color: var(--white-main);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 1rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray-medium);
        }
        .empty-state h2 {
            color: var(--gray-dark);
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .referees-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏅 Arbitri Registrati</h1>
            <p style="color: var(--gray-medium); margin: 0;">Tutti gli arbitri della piattaforma</p>
        </div>
        
        <div class="referees-grid">
            <div th:each="arbitro : ${arbitri}" class="referee-card">
                <h2 class="referee-name" th:text="${arbitro.nome} + ' ' + ${arbitro.cognome}">Nome Cognome</h2>
                
                <div class="info-row">
                    <span class="info-label">Codice Arbitrale</span>
                    <span class="badge-code" th:text="${arbitro.codiceArbitrale}">Codice</span>
                </div>
            </div>
        </div>

        <div th:if="${arbitri.empty}" class="empty-state">
            <h2>📭 Nessun arbitro disponibile</h2>
            <p>Non ci sono arbitri registrati al momento.</p>
        </div>

        <a href="/" class="back-link" style="display: block; text-align: center; margin: 2rem 0;">← Torna alla Home</a>
    </div>
</body>
</html>

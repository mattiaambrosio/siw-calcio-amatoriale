<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Arbitri</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #1d1d1f; color: white; padding: 40px; text-align: center; }
        .arbitro-card { background-color: #2d2d2f; padding: 20px; border-radius: 10px; margin: 15px auto; max-width: 500px; text-align: left; border-left: 5px solid #9b59b6; }
        h2 { color: #9b59b6; margin-top: 0; }
        .back-link { display: inline-block; margin-top: 30px; color: #86868b; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Arbitri Registrati</h1>
    
    <div th:each="arbitro : ${arbitri}" class="arbitro-card">
        <h2 th:text="${arbitro.nome} + ' ' + ${arbitro.cognome}">Nome Cognome</h2>
        <p><strong>Codice Arbitrale:</strong> <span th:text="${arbitro.codiceArbitrale}">Codice</span></p>
    </div>

    <div th:if="${arbitri.empty}">
        <p>Nessun arbitro registrato nel sistema.</p>
    </div>

    <a href="/" class="back-link">‹ Torna alla Home</a>
</body>
</html>

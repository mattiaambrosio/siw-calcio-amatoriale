<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Arbitri</title>
   <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Arbitri Registrati</h1>
    
    <div th:each="arbitro : ${arbitri}" class="card">
        <h2 th:text="${arbitro.nome} + ' ' + ${arbitro.cognome}">Nome Cognome</h2>
        <p><strong>Codice Arbitrale:</strong> <span th:text="${arbitro.codiceArbitrale}">Codice</span></p>
    </div>

    <div th:if="${arbitri.empty}">
        <p>Nessun arbitro registrato nel sistema.</p>
    </div>

    <a href="/" class="back-link">‹ Torna alla Home</a>
</body>
</html>

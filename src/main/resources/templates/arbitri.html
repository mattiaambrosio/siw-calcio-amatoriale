<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitri – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Header -->
        <div class="section-header anim-fade-up" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Corpo Arbitrale</h1>
                <p>I garanti del fair-play nei nostri tornei.</p>
            </div>
            <a href="/admin/arbitro/new"
               sec:authorize="hasAuthority('ADMIN')"
               class="btn btn-primary">+ Nuovo Arbitro</a>
        </div>

        <!-- Search -->
        <div class="search-bar anim-fade-up anim-delay-1">
            <input type="text" id="searchArbitri" placeholder="🔍 Cerca un arbitro…">
            <button id="clearSearch" class="btn btn-ghost btn-sm" style="display:none;">✕ Cancella</button>
        </div>

        <!-- Tabella -->
        <div class="glass-panel anim-fade-up anim-delay-2" style="padding: 1rem;">
            <table id="arbitriTable">
                <thead>
                    <tr>
                        <th>Arbitro</th>
                        <th>Codice Arbitrale</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${arbitri}">
                        <td>
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <div style="width: 32px; height: 32px; background: var(--green-dim); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0;">🏁</div>
                                <span style="font-weight: 600; color: var(--text-primary);"
                                      th:text="${a.nome} + ' ' + ${a.cognome}">Nome</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge badge-gray" th:text="${a.codiceArbitrale}">COD001</span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(arbitri)}" class="empty-state" style="padding: 3rem;">
                <p>Nessun arbitro registrato nel sistema.</p>
                <a href="/admin/arbitro/new" sec:authorize="hasAuthority('ADMIN')" class="btn btn-primary" style="margin-top: 1rem;">+ Aggiungi Arbitro</a>
            </div>
        </div>

    </main>

    <script>
        const input    = document.getElementById('searchArbitri');
        const clearBtn = document.getElementById('clearSearch');
        const rows     = document.querySelectorAll('#arbitriTable tbody tr');
        let noRow      = null;

        input.addEventListener('input', () => {
            const q = input.value.toLowerCase();
            clearBtn.style.display = q ? 'inline-flex' : 'none';
            let visible = 0;
            rows.forEach(r => {
                const match = r.textContent.toLowerCase().includes(q);
                r.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            if (noRow) noRow.remove();
            if (visible === 0 && q) {
                noRow = document.createElement('tr');
                noRow.innerHTML = '<td colspan="2" style="text-align:center;padding:2rem;color:var(--text-muted);">Nessun arbitro trovato</td>';
                document.querySelector('#arbitriTable tbody').appendChild(noRow);
            }
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            input.dispatchEvent(new Event('input'));
            input.focus();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="form-container">
        <h1>Area Riservata</h1>
        <p style="text-align: center; color: #8b949e; margin-bottom: 20px;">
            Accedi per gestire il torneo
        </p>

        <div th:if="${param.error}" class="card" style="border-top: 4px solid var(--accent-red); margin-bottom: 20px; padding: 10px;">
            <p style="color: var(--accent-red); margin: 0; font-weight: 600;">
                Username o password errati!
            </p>
        </div>

        <form th:action="@{/login}" method="post">
            <label>Username</label>
            <input type="text" name="username" placeholder="es. admin" required />

            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />

            <button type="submit" class="btn btn-primary" style="width: 100%;">Entra in Campo</button>
        </form>

        <a href="/" class="back-link">Torna alla Home</a>
    </div>
</body>
</html>

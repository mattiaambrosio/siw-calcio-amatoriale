<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .auth-container {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: slideInLeft 0.6s ease-out;
        }
        .auth-container h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            color: var(--white-main);
        }
        .auth-container > p {
            margin: 0 0 1.5rem 0;
            color: var(--gray-medium);
            font-size: 0.95rem;
        }
        .form-section {
            margin-bottom: 1.5rem;
        }
        .form-section label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--white-main);
            font-size: 0.95rem;
            font-weight: 600;
        }
        .form-section input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--white-main);
            font-size: 0.95rem;
        }
        .form-section input:focus {
            outline: none;
            border-color: var(--pitch-green-light);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
            background: rgba(46, 204, 113, 0.02);
        }
        .form-section input::placeholder {
            color: var(--gray-medium);
        }
        .divider {
            margin: 1.5rem 0;
            text-align: center;
            color: var(--gray-medium);
            font-size: 0.9rem;
        }
        .oauth-btn {
            display: block;
            width: 100%;
            padding: 0.8rem 1.5rem;
            background: var(--google-blue);
            border: none;
            color: var(--white-main);
            font-weight: 600;
            border-radius: 980px;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
        }
        .oauth-btn:hover {
            background: #3367D6;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        .submit-btn {
            width: 100%;
            padding: 0.8rem 1.5rem;
            background-color: var(--pitch-green-light);
            border: none;
            border-radius: 980px;
            color: #000000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(50, 215, 75, 0.3);
        }
        .submit-btn:hover {
            transform: scale(1.02);
            background-color: var(--pitch-green-bright);
        }
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }
        .footer-links p {
            margin: 0 0 0.75rem 0;
            color: var(--gray-medium);
            font-size: 0.9rem;
        }
        .footer-links a {
            color: var(--pitch-green-light);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .footer-links a:hover {
            color: var(--pitch-green-bright);
        }
        .back-home {
            display: inline-block;
            margin-top: 1rem;
            color: var(--gray-medium);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .back-home:hover {
            color: var(--pitch-green-light);
        }
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 90vh;">
        <div class="glass-panel" style="width: 100%; max-width: 450px; padding: 3rem;">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Bentornato</h1>
                <p style="color: var(--gray-medium);">Accedi per gestire il tuo profilo.</p>
            </div>

            <!-- MESSAGGI ERRORE -->
            <div th:if="${param.error}" style="background: rgba(255,69,58,0.1); color: var(--danger-red); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center;">
                Email o password non corretti.
            </div>

            <!-- FORM TRADIZIONALE -->
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group">
                    <label for="username">Indirizzo Email</label>
                    <input type="email" id="username" name="email" required placeholder="nome@esempio.it">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">Accedi</button>
            </form>

            <!-- DIVIDER -->
            <div style="display: flex; align-items: center; margin: 2.5rem 0; color: var(--gray-medium); font-size: 0.8rem;">
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
                <span style="padding: 0 1rem;">oppure</span>
                <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
            </div>

            <!-- GOOGLE LOGIN -->
            <a href="/oauth2/authorization/google" class="btn btn-google" style="width: 100%; padding: 1rem; display: flex; align-items: center; justify-content: center; background: #4285F4; color: white; border-radius: 8px; text-decoration: none;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22Color%22_Logo.svg" style="width:18px; margin-right:12px; filter: brightness(0) invert(1);">
                Continua con Google
            </a>

            <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--gray-medium);">
                Non hai un account? <a href="/register" style="color: var(--accent-green); text-decoration: none; font-weight: 600;">Registrati</a>
            </p>
        </div>
    </main>
</body>

</html>

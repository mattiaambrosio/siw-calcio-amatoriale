<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <!-- Logo / Brand -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">⚽</div>
                <h1 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Bentornato</h1>
                <p style="font-size: 0.875rem;">Accedi per commentare le partite e gestire il tuo profilo.</p>
            </div>

            <!-- Error message -->
            <div th:if="${param.error}" class="alert alert-error">
                ⚠️ Username o password non corretti. Riprova.
            </div>

            <!-- Form -->
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="email"
                           required placeholder="mario.rossi@esempio.it" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                    Accedi
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">oppure</div>

            <!-- Google OAuth -->
            <a href="/oauth2/authorization/google" class="btn btn-google" style="width: 100%; padding: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                    <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Continua con Google
            </a>

            <!-- Footer -->
            <p style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
                Non hai un account?
                <a href="/register" style="color: var(--green); font-weight: 600;">Registrati</a>
            </p>
            <p style="text-align: center; margin-top: 0.5rem; font-size: 0.82rem;">
                <a href="/" style="color: var(--text-muted);">← Torna alla Home</a>
            </p>

        </div>
    </div>
</body>
</html>

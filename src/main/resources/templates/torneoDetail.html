<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${torneo.nome} + ' – Calcio Amatoriale'">Dettaglio Torneo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Breadcrumb -->
        <div class="breadcrumb anim-fade-up">
            <a href="/tornei">← Tornei</a>
            <span class="sep">/</span>
            <span th:text="${torneo.nome}">Torneo</span>
        </div>

        <!-- Header torneo -->
        <div class="anim-fade-up" style="margin-bottom: 2.5rem;">
            <span class="badge badge-green" style="margin-bottom: 0.75rem;" th:text="${torneo.anno}">2026</span>
            <h1 th:text="${torneo.nome}">Nome Torneo</h1>
            <p style="margin-top: 0.5rem; max-width: 680px;" th:text="${torneo.descrizione}">Descrizione del torneo.</p>

            <!-- Actions bar -->
            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <a th:href="@{'/torneo/' + ${torneo.id} + '/classifica'}" class="btn btn-primary">🏆 Classifica</a>
                <a th:href="@{'/partite'}" class="btn btn-outline">📅 Tutte le Partite</a>

                <div sec:authorize="hasAuthority('ADMIN')" style="display: flex; gap: 0.5rem;">
                    <a th:href="@{'/admin/torneo/' + ${torneo.id} + '/edit'}" class="btn btn-outline">✏️ Modifica</a>
                    <a th:href="@{'/admin/iscrizione'}" class="btn btn-outline">➕ Iscrivi Squadra</a>
                    <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/delete'}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Eliminare questo torneo?')">🗑️ Elimina</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 2-column layout: squadre + partite -->
        <div class="grid-2 anim-fade-up anim-delay-1">

            <!-- Squadre partecipanti -->
            <div class="glass-panel" style="margin-bottom: 0;">
                <h3 style="margin-bottom: 1.25rem; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;">
                    Squadre Partecipanti
                    (<span th:text="${torneo.squadre != null ? #lists.size(torneo.squadre) : 0}">0</span>)
                </h3>

                <div th:if="${torneo.squadre != null and !torneo.squadre.empty}">
                    <div th:each="sq : ${torneo.squadre}"
                         style="display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid var(--border);">
                        <div>
                            <a th:href="@{'/squadra/' + ${sq.id}}"
                               style="font-weight: 600; color: var(--text-primary);"
                               th:text="${sq.nome}">Squadra</a>
                            <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${sq.citta}">Città</div>
                        </div>
                        <a th:href="@{'/squadra/' + ${sq.id}}" class="btn btn-ghost btn-sm">→</a>
                    </div>
                </div>
                <p th:if="${torneo.squadre == null or torneo.squadre.empty}"
                   style="color: var(--text-muted); font-style: italic; font-size: 0.875rem;">
                    Nessuna squadra iscritta.
                </p>
            </div>

            <!-- Calendario partite -->
            <div class="glass-panel" style="margin-bottom: 0;">
                <h3 style="margin-bottom: 1.25rem; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;">
                    Calendario Partite
                    (<span th:text="${torneo.partite != null ? #lists.size(torneo.partite) : 0}">0</span>)
                </h3>

                <div th:if="${torneo.partite != null and !torneo.partite.empty}">
                    <div th:each="p : ${torneo.partite}"
                         style="padding: 0.75rem 0; border-bottom: 1px solid var(--border);">
                        <a th:href="@{'/partita/' + ${p.id}}"
                           style="display: flex; align-items: center; justify-content: space-between; text-decoration: none;">
                            <div>
                                <div style="font-weight: 600; color: var(--text-primary); font-size: 0.9rem;">
                                    <span th:text="${p.squadraCasa.nome}">Casa</span>
                                    <span th:if="${p.stato == 'GIOCATA'}"
                                          style="color: var(--green); margin: 0 0.3rem;"
                                          th:text="${p.goalsHome + '-' + p.goalsAway}">0-0</span>
                                    <span th:if="${p.stato != 'GIOCATA'}"
                                          style="color: var(--text-muted); margin: 0 0.3rem;">vs</span>
                                    <span th:text="${p.squadraOspite.nome}">Ospite</span>
                                </div>
                                <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;"
                                     th:text="${#temporals.format(p.dataEOra, 'dd/MM/yyyy HH:mm')}">Data</div>
                            </div>
                            <span class="badge badge-green" th:if="${p.stato == 'GIOCATA'}">Giocata</span>
                            <span class="badge badge-orange" th:if="${p.stato == 'PROGRAMMATA'}">Programmata</span>
                        </a>
                    </div>
                </div>
                <p th:if="${torneo.partite == null or torneo.partite.empty}"
                   style="color: var(--text-muted); font-style: italic; font-size: 0.875rem;">
                    Nessuna partita programmata.
                </p>
            </div>

        </div>

    </main>
</body>
</html>

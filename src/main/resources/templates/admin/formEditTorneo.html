<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Torneo - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-container { max-width: 600px; margin: 3rem auto; }
        .form-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }
        .breadcrumb { font-size: 0.85rem; color: var(--gray-medium); margin-bottom: 1.5rem; }
        .breadcrumb a { color: var(--accent-blue); }
    </style>
</head>
<body>
<div class="form-container">
    <div class="breadcrumb">
        <a th:href="@{'/torneo/' + ${torneo.id}}">← Torna al Torneo</a>
    </div>
    <div class="form-panel">
        <h1 style="margin-bottom:1.5rem;">✏️ Modifica Torneo</h1>
        <form th:action="@{'/admin/torneo/' + ${torneo.id} + '/edit'}" th:object="${torneo}" method="post">
            <div class="form-group">
                <label for="nome">Nome del Torneo</label>
                <input type="text" id="nome" th:field="*{nome}" required placeholder="Es. Torneo Estivo 2026">
            </div>
            <div class="form-group">
                <label for="anno">Anno</label>
                <input type="number" id="anno" th:field="*{anno}" required min="2000" max="2100">
            </div>
            <div class="form-group">
                <label for="descrizione">Descrizione</label>
                <textarea id="descrizione" th:field="*{descrizione}" rows="4" placeholder="Descrizione del torneo..."></textarea>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">💾 Salva Modifiche</button>
                <a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

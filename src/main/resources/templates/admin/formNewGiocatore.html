<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Giocatore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-container">
    <h2>Aggiungi Giocatore</h2>
    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/giocatore}" th:object="${giocatore}" method="POST">
        
        <label>Nome</label>
        <input type="text" th:field="*{nome}" required />
        
        <label>Cognome</label>
        <input type="text" th:field="*{cognome}" required />

        <label>Data di Nascita</label>
        <input type="date" th:field="*{dataDiNascita}" required />

        <label>Ruolo</label>
        <select th:field="*{ruolo}" required>
            <option value="Portiere">Portiere</option>
            <option value="Difensore">Difensore</option>
            <option value="Centrocampista">Centrocampista</option>
            <option value="Attaccante">Attaccante</option>
        </select>

        <label>Altezza (cm)</label>
        <input type="number" th:field="*{altezza}" required />

        <label>Squadra di appartenenza</label>
        <select th:field="*{squadra}" required>
            <option th:each="squadraOption : ${squadre}" 
                    th:value="${squadraOption.id}" 
                    th:text="${squadraOption.nome}"></option>
        </select>
        
        <button type="submit" class="btn-submit">Salva Giocatore</button>
    </form>
    <a href="/" class="back-link">Torna alla Home</a>
</div>
</body>
</html>

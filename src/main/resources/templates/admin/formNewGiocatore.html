<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Giocatore – Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <div class="breadcrumb" style="margin-bottom: 1.5rem;">
                <a href="/giocatori">← Giocatori</a>
                <span class="sep">/</span>
                <span>Nuovo Giocatore</span>
            </div>

            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">⚽ Aggiungi Giocatore</h1>
            <p style="margin-bottom: 1.75rem; font-size: 0.875rem;">Inserisci i dati del nuovo giocatore.</p>

            <div class="alert alert-error" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></div>

            <form th:action="@{/admin/giocatore}" th:object="${giocatore}" method="POST">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" th:field="*{nome}" required placeholder="Mario">
                        <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
                    </div>
                    <div class="form-group">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" th:field="*{cognome}" required placeholder="Rossi">
                        <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" style="color:red"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dataDiNascita">Data di Nascita</label>
                    <input type="date" id="dataDiNascita" th:field="*{dataDiNascita}" required>
                    <span th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}" style="color:red"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ruolo">Ruolo</label>
                        <select id="ruolo" th:field="*{ruolo}" required>
                            <option value="">— Seleziona —</option>
                            <option value="Portiere">Portiere</option>
                            <option value="Difensore">Difensore</option>
                            <option value="Centrocampista">Centrocampista</option>
                            <option value="Attaccante">Attaccante</option>
                        </select>
                        <span th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}" style="color:red"></span>
                    </div>
                    <div class="form-group">
                        <label for="altezza">Altezza (cm)</label>
                        <input type="number" id="altezza" th:field="*{altezza}"
                               required placeholder="180" min="140" max="220">
                        <span th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}" style="color:red"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="squadra">Squadra di Appartenenza</label>
                    <select id="squadra" th:field="*{squadra}" required>
                        <option value="">— Seleziona squadra —</option>
                        <option th:each="s : ${squadre}"
                                th:value="${s.id}"
                                th:text="${s.nome}">Squadra</option>
                    </select>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salva Giocatore</button>
                    <a href="/giocatori" class="btn btn-secondary" style="flex: 1; text-align: center;">Annulla</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

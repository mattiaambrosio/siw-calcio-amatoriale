<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Torneo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1d1d1f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #2d2d2f;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #1d1d1f;
            color: white;
            box-sizing: border-box;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }
        .error-msg {
            color: #ff4757;
            margin-bottom: 15px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #86868b;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Crea Nuovo Torneo</h2>

    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/torneo}" th:object="${torneo}" method="POST">
        
        <label>Nome Torneo</label>
        <input type="text" th:field="*{nome}" required placeholder="es. Serie A" />
        
        <label>Anno</label>
        <input type="number" th:field="*{anno}" required placeholder="es. 2026" />
        
        <label>Descrizione</label>
        <input type="text" th:field="*{descrizione}" required placeholder="es. Torneo estivo" />
        
        <button type="submit" class="btn-submit">Salva Torneo</button>
    </form>

    <a href="/" class="back-link">Torna alla Home</a>
</div>

</body>
</html>

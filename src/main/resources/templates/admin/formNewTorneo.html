<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Torneo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="form-container">
    <h2>Crea Nuovo Torneo</h2>

    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/torneo}" th:object="${torneo}" method="POST">
        
        <label>Nome Torneo</label>
        <input type="text" th:field="*{nome}" required placeholder="es. Serie A" />
        
        <label>Anno</label>
        <input type="number" th:field="*{anno}" required placeholder="es. 2026" />
        
        <label>Descrizione</label>
        <input type="text" th:field="*{descrizione}" required placeholder="es. Torneo estivo" />
        
        <button type="submit" class="btn-submit">Salva Torneo</button>
    </form>

    <a href="/" class="back-link">Torna alla Home</a>
</div>

</body>
</html>

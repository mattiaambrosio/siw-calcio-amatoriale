<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Torneo – Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <div class="breadcrumb" style="margin-bottom: 1.5rem;">
                <a href="/tornei">← Tornei</a>
                <span class="sep">/</span>
                <span>Nuovo Torneo</span>
            </div>

            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">🏆 Crea Nuovo Torneo</h1>
            <p style="margin-bottom: 1.75rem; font-size: 0.875rem;">Inserisci i dati del torneo.</p>

            <div class="alert alert-error" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></div>

            <form th:action="@{/admin/torneo}" th:object="${torneo}" method="POST">

                <div class="form-group">
                    <label for="nome">Nome Torneo</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           required placeholder="es. Torneo Estivo 2026">
                    <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
                </div>

                <div class="form-group">
                    <label for="anno">Anno</label>
                    <input type="number" id="anno" th:field="*{anno}"
                           required placeholder="2026" min="2000" max="2100">
                    <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" style="color:red"></span>
                </div>

                <div class="form-group">
                    <label for="descrizione">Descrizione</label>
                    <textarea id="descrizione" th:field="*{descrizione}"
                              placeholder="Descrizione del torneo…"></textarea>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salva Torneo</button>
                    <a href="/tornei" class="btn btn-secondary" style="flex: 1; text-align: center;">Annulla</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

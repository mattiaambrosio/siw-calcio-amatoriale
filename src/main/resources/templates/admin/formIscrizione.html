<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iscrivi Squadra</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #1d1d1f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background-color: #2d2d2f; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 350px; }
        select { width: 100%; padding: 10px; margin: 10px 0 20px 0; border-radius: 8px; border: 1px solid #555; background-color: #1d1d1f; color: white; }
        .btn-submit { background-color: #f39c12; color: white; padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background-color: #d68910; }
        .error-msg { color: #ff4757; margin-bottom: 15px; }
        .back-link { display: block; margin-top: 20px; color: #86868b; text-decoration: none; }
    </style>
</head>
<body>
<div class="form-container">
    <h2 style="color: #f39c12;">Iscrivi al Torneo</h2>
    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/iscrizione}" method="POST">
        
        <label>Seleziona Torneo</label>
        <select name="torneoId" required>
            <option th:each="t : ${tornei}" th:value="${t.id}" th:text="${t.nome}"></option>
        </select>

        <label>Seleziona Squadra da Iscrivere</label>
        <select name="squadraId" required>
            <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
        </select>
        
        <button type="submit" class="btn-submit">Conferma Iscrizione</button>
    </form>
    <a href="/" class="back-link">Torna alla Home</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuova Squadra</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #1d1d1f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background-color: #2d2d2f; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0 20px 0; border-radius: 8px; border: 1px solid #555; background-color: #1d1d1f; color: white; box-sizing: border-box; }
        .btn-submit { background-color: #2ecc71; color: white; padding: 12px 20px; border: none; border-radius: 25px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background-color: #27ae60; }
        .error-msg { color: #ff4757; margin-bottom: 15px; }
        .back-link { display: block; margin-top: 20px; color: #86868b; text-decoration: none; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Aggiungi Squadra</h2>
    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/squadra}" th:object="${squadra}" method="POST">
        <label>Nome Squadra</label>
        <input type="text" th:field="*{nome}" required placeholder="es. Napoli" />
        
        <label>Anno di Fondazione</label>
        <input type="number" th:field="*{annoDiFondazione}" required placeholder="es. 1926" />
        
        <label>Città</label>
        <input type="text" th:field="*{citta}" required placeholder="es. Napoli" />
        
        <button type="submit" class="btn-submit">Salva Squadra</button>
    </form>
    <a href="/" class="back-link">Torna alla Home</a>
</div>
</body>
</html>

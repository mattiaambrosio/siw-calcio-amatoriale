<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Partita – Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <div class="breadcrumb" style="margin-bottom: 1.5rem;">
                <a href="/partite">← Partite</a>
                <span class="sep">/</span>
                <span>Nuova Partita</span>
            </div>

            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">📅 Programma Partita</h1>
            <p style="margin-bottom: 1.75rem; font-size: 0.875rem;">Inserisci i dati per registrare una nuova partita.</p>

            <div class="alert alert-error" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></div>

            <form th:action="@{/admin/partita}" th:object="${partita}" method="POST">

                <div class="form-group">
                    <label for="torneo">Torneo</label>
                    <select id="torneo" th:field="*{torneo}" required>
                        <option value="">— Seleziona Torneo —</option>
                        <option th:each="t : ${tornei}" th:value="${t.id}" th:text="${t.nome}">Torneo</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="squadraCasa">Squadra in Casa</label>
                        <select id="squadraCasa" th:field="*{squadraCasa}" required>
                            <option value="">— Seleziona —</option>
                            <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}">Squadra</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="squadraOspite">Squadra Ospite</label>
                        <select id="squadraOspite" th:field="*{squadraOspite}" required>
                            <option value="">— Seleziona —</option>
                            <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}">Squadra</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="arbitro">Arbitro</label>
                    <select id="arbitro" th:field="*{arbitro}" required>
                        <option value="">— Seleziona Arbitro —</option>
                        <option th:each="a : ${arbitri}"
                                th:value="${a.id}"
                                th:text="${a.nome} + ' ' + ${a.cognome}">Arbitro</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataEOra">Data e Ora</label>
                        <input type="datetime-local" id="dataEOra" th:field="*{dataEOra}" required>
                    </div>
                    <div class="form-group">
                        <label for="luogo">Luogo (Stadio/Campo)</label>
                        <input type="text" id="luogo" th:field="*{luogo}" required placeholder="es. Campo Sportivo Roma">
                        <span th:if="${#fields.hasErrors('luogo')}" th:errors="*{luogo}" style="color:red"></span>
                    </div>
                </div>

                <input type="hidden" th:field="*{goalsHome}" value="0"/>
                <input type="hidden" th:field="*{goalsAway}" value="0"/>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salva Partita</button>
                    <a href="/partite" class="btn btn-secondary" style="flex: 1; text-align: center;">Annulla</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuova Partita</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-container">
    <h2>Programma Partita</h2>
    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/partita}" th:object="${partita}" method="POST">
        
        <label>Torneo</label>
        <select th:field="*{torneo}" required>
            <option th:each="t : ${tornei}" th:value="${t.id}" th:text="${t.nome}"></option>
        </select>

        <label>Squadra in Casa</label>
        <select th:field="*{squadraCasa}" required>
            <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
        </select>

        <label>Squadra in Trasferta</label>
        <select th:field="*{squadraOspite}" required>
            <option th:each="s : ${squadre}" th:value="${s.id}" th:text="${s.nome}"></option>
        </select>

        <label>Arbitro</label>
        <select th:field="*{arbitro}" required>
            <option th:each="a : ${arbitri}" th:value="${a.id}" th:text="${a.nome} + ' ' + ${a.cognome}"></option>
        </select>

        <label>Data e Ora</label>
        <input type="datetime-local" th:field="*{dataEOra}" required />
        
        <label>Luogo (Stadio/Campo)</label>
        <input type="text" th:field="*{luogo}" required placeholder="es. Stadio Olimpico" />
        
        <input type="hidden" th:field="*{goalsHome}" value="0" />
        <input type="hidden" th:field="*{goalsAway}" value="0" />
        
        <button type="submit" class="btn-submit">Salva Partita</button>
    </form>
    <a href="/" class="back-link">Torna alla Home</a>
</div>
</body>
</html>

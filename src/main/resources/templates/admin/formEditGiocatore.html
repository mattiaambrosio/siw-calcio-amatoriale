<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Giocatore – Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <div class="breadcrumb" style="margin-bottom: 1.5rem;">
                <a href="/giocatori">← Giocatori</a>
                <span class="sep">/</span>
                <span th:text="${giocatore.nome} + ' ' + ${giocatore.cognome}">Giocatore</span>
                <span class="sep">/</span>
                <span>Modifica</span>
            </div>

            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">✏️ Modifica Giocatore</h1>
            <p style="margin-bottom: 1.75rem; font-size: 0.875rem;">Aggiorna le informazioni del giocatore.</p>

            <form th:action="@{'/admin/giocatore/' + ${giocatore.id} + '/edit'}" th:object="${giocatore}" method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" th:field="*{nome}" required>
                    </div>
                    <div class="form-group">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" th:field="*{cognome}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataDiNascita">Data di Nascita</label>
                        <input type="date" id="dataDiNascita" th:field="*{dataDiNascita}" required>
                    </div>
                    <div class="form-group">
                        <label for="altezza">Altezza (cm)</label>
                        <input type="number" id="altezza" th:field="*{altezza}" min="100" max="250">
                    </div>
                </div>

                <div class="form-group">
                    <label for="ruolo">Ruolo</label>
                    <select id="ruolo" th:field="*{ruolo}" required>
                        <option value="">— Seleziona Ruolo —</option>
                        <option value="Portiere">Portiere</option>
                        <option value="Difensore">Difensore</option>
                        <option value="Centrocampista">Centrocampista</option>
                        <option value="Attaccante">Attaccante</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="squadraId">Squadra</label>
                    <select id="squadraId" th:field="*{squadra.id}" required>
                        <option value="">— Seleziona Squadra —</option>
                        <option th:each="s : ${squadre}"
                                th:value="${s.id}"
                                th:text="${s.nome}">Squadra</option>
                    </select>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salva Modifiche</button>
                    <a href="/giocatori" class="btn btn-secondary" style="flex: 1; text-align: center;">Annulla</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

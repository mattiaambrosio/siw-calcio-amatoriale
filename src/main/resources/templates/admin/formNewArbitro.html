<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuovo Arbitro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-container">
    <h2>Registra Arbitro</h2>
    <p class="error-msg" th:if="${messaggioErrore}" th:text="${messaggioErrore}"></p>

    <form th:action="@{/admin/arbitro}" th:object="${arbitro}" method="POST">
        <label>Nome</label>
        <input type="text" th:field="*{nome}" required />
        
        <label>Cognome</label>
        <input type="text" th:field="*{cognome}" required />
        
        <label>Codice Arbitrale</label>
        <input type="text" th:field="*{codiceArbitrale}" required placeholder="es. ARB-001" />
        
        <button type="submit" class="btn-submit">Salva Arbitro</button>
    </form>
    <a href="/" class="back-link">Torna alla Home</a>
</div>
</body>
</html>

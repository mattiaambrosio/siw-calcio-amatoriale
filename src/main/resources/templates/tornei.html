<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tornei – Calcio Amatoriale</title>
    <meta name="description" content="Elenco di tutti i tornei di calcio amatoriale disponibili.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Header -->
        <div class="section-header anim-fade-up" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Tornei</h1>
                <p>Scegli un torneo per vedere squadre, calendari e classifiche.</p>
        
            </div>
            <a href="/admin/torneo/new"
               sec:authorize="hasAuthority('ADMIN')"
               class="btn btn-primary">+ Nuovo Torneo</a>
        </div>

        <!-- Search -->
        <form method="get" action="/tornei" class="search-bar anim-fade-up anim-delay-1">
            <input type="text" name="search" placeholder="🔍 Cerca un torneo…"
                   th:value="${param.search}">
            <button type="submit" class="btn btn-primary btn-sm">Cerca</button>
        </form>

        <!-- Grid tornei -->
        <div class="grid-3 anim-fade-up anim-delay-2" id="torneiGrid">
            <div th:each="torneo : ${tornei}" class="card card-green">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                    <span class="badge badge-green" th:text="${torneo.anno}">2026</span>
                </div>
                <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;" th:text="${torneo.nome}">Nome Torneo</h2>
                <p style="font-size: 0.875rem; margin-bottom: 1.5rem; min-height: 2.6em;" th:text="${torneo.descrizione}">Descrizione</p>
                <a th:href="@{'/torneo/' + ${torneo.id}}" class="btn btn-primary" style="width: 100%;">Vedi Dettaglio →</a>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(tornei)}" class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🏆</div>
            <h3>Nessun torneo disponibile</h3>
            <p>Non ci sono ancora tornei registrati nel sistema.</p>
            <a href="/admin/torneo/new" sec:authorize="hasAuthority('ADMIN')" class="btn btn-primary" style="margin-top: 1.5rem;">+ Crea il Primo Torneo</a>
        </div>


    </main>

</body>
</html>

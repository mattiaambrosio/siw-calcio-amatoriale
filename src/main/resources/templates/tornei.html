<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tornei Disponibili</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1d1d1f;
            color: white;
            padding: 40px;
            text-align: center;
        }
        .torneo-card {
            background-color: #2d2d2f;
            padding: 20px;
            border-radius: 10px;
            margin: 15px auto;
            max-width: 500px;
            text-align: left;
            border-left: 5px solid #2ecc71;
        }
        h2 { color: #2ecc71; }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #86868b;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>Tornei Disponibili</h1>
    <p>Ecco la lista dei tornei attualmente attivi.</p>

    <div th:each="torneo : ${tornei}" class="torneo-card">
        <h2 th:text="${torneo.nome}">Nome Torneo</h2>
        <p><strong>Anno:</strong> <span th:text="${torneo.anno}">2026</span></p>
        <p><strong>Descrizione:</strong> <span th:text="${torneo.descrizione}">Descrizione</span></p>
    </div>

    <div th:if="${tornei.empty}">
        <p>Non c'è ancora nessun torneo nel sistema.</p>
    </div>

    <a href="/" class="back-link">‹ Torna alla Home</a>

</body>
</html>

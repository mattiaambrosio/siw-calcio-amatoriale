<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tornei Disponibili</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Tornei Disponibili</h1>
    <p>Ecco la lista dei tornei attualmente attivi.</p>

   <div th:each="torneo : ${tornei}" class="card">
        <h2 th:text="${torneo.nome}">Nome Torneo</h2>
        <p><strong>Anno:</strong> <span th:text="${torneo.anno}">2026</span></p>
        <p><strong>Descrizione:</strong> <span th:text="${torneo.descrizione}">Descrizione</span></p>

        <hr style="border-color: #555; margin-top: 15px;">
        <p style="color: #2ecc71; font-weight: bold;">Squadre Iscritte:</p>
        
        <ul th:if="${!torneo.squadre.empty}" style="list-style-type: square; color: #ddd;">
            <li th:each="squadra : ${torneo.squadre}" th:text="${squadra.nome} + ' (' + ${squadra.citta} + ')'">Squadra</li>
        </ul>
        <p th:if="${torneo.squadre.empty}" style="color: #888; font-style: italic; font-size: 0.9em;">
            Ancora nessuna squadra iscritta.
        </p>

        <div style="margin-top: 20px; text-align: center;">
            <a th:href="@{'/torneo/' + ${torneo.id} + '/classifica'}" class="btn btn-primary" style="width: 100%;">Vedi Classifica</a>
        </div>
    </div>

    <div th:if="${tornei.empty}">
        <p>Non c'è ancora nessun torneo nel sistema.</p>
    </div>

    <a href="/" class="back-link">‹ Torna alla Home</a>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Partite – Calcio Amatoriale</title>
    <meta name="description" content="Calendario di tutte le partite dei tornei di calcio amatoriale.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Header -->
        <div class="section-header anim-fade-up" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Calendario Partite</h1>
                <p>Tutte le partite programmate e i risultati.</p>
            </div>
            <a href="/admin/partita/new"
               sec:authorize="hasAuthority('ADMIN')"
               class="btn btn-primary">+ Nuova Partita</a>
        </div>

        <!-- Grid partite -->
        <div class="grid-2 anim-fade-up anim-delay-1">
            <div th:each="p : ${partite}" class="card card-green">

                <!-- Torneo badge -->
                <div style="margin-bottom: 1rem;">
                    <span class="badge badge-blue" th:text="${p.torneo.nome}">Torneo</span>
                </div>

                <!-- Squadre + score -->
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem;">
                    <div style="flex: 1; text-align: right;">
                        <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);"
                             th:text="${p.squadraCasa.nome}">Casa</div>
                    </div>

                    <div class="score-box" style="min-width: 90px; padding: 0.5rem 1rem;">
                        <div class="score" th:if="${p.stato == 'GIOCATA'}" style="font-size: 1.8rem;"
                             th:text="${p.goalsHome} + '-' + ${p.goalsAway}">0-0</div>
                        <div class="vs" th:if="${p.stato != 'GIOCATA'}">VS</div>
                    </div>

                    <div style="flex: 1; text-align: left;">
                        <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);"
                             th:text="${p.squadraOspite.nome}">Ospite</div>
                    </div>
                </div>

                <!-- Status -->
                <div style="text-align: center; margin-bottom: 1rem;">
                    <span class="badge badge-green" th:if="${p.stato == 'GIOCATA'}">✓ Giocata</span>
                    <span class="badge badge-orange" th:if="${p.stato == 'PROGRAMMATA'}">⏰ Programmata</span>
                </div>

                <!-- Meta info -->
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.25rem;">
                    <span class="info-pill">📅 <span th:text="${#temporals.format(p.dataEOra, 'dd/MM HH:mm')}">Data</span></span>
                    <span class="info-pill">🏟️ <span th:text="${p.luogo}">Luogo</span></span>
                    <span class="info-pill">⚖️ <span th:text="${p.arbitro.nome} + ' ' + ${p.arbitro.cognome}">Arbitro</span></span>
                </div>

                <a th:href="@{'/partita/' + ${p.id}}" class="btn btn-outline" style="width: 100%;">
                    💬 Dettaglio &amp; Commenti
                </a>
            </div>
        </div>

        <!-- Empty -->
        <div th:if="${partite.empty}" class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📅</div>
            <h3>Nessuna partita disponibile</h3>
            <p>Non ci sono partite programmate al momento.</p>
            <a href="/admin/partita/new" sec:authorize="hasAuthority('ADMIN')" class="btn btn-primary" style="margin-top: 1.5rem;">+ Programma una Partita</a>
        </div>

    </main>
</body>
</html>

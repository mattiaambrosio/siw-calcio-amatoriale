<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendario Partite</title>
   <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1 style="color: #e74c3c;">Calendario Partite</h1>
    
    <div th:each="partita : ${partite}" class="card">
        <span class="badge-torneo" th:text="${partita.torneo.nome}">Torneo</span>
        
        <div class="match-title">
            <span th:text="${partita.squadraCasa.nome}">Casa</span>
            <span class="vs">VS</span>
            <span th:text="${partita.squadraOspite.nome}">Ospite</span>
        </div>
        
        <h3 th:if="${partita.stato == 'GIOCATA'}" style="color: #2ecc71;">
            Risultato: <span th:text="${partita.goalsHome}">0</span> - <span th:text="${partita.goalsAway}">0</span>
        </h3>
        <h3 th:if="${partita.stato == 'PROGRAMMATA'}" style="color: #e67e22;">
            Stato: Da giocare
        </h3>

        <div class="details">
            <p><strong>🕒 Data e Ora:</strong> <span th:text="${#temporals.format(partita.dataEOra, 'dd/MM/yyyy HH:mm')}">Data</span></p>
            <p><strong>🏟️ Luogo:</strong> <span th:text="${partita.luogo}">Stadio</span></p>
            <p><strong>⚽ Arbitro:</strong> <span th:text="${partita.arbitro.nome} + ' ' + ${partita.arbitro.cognome}">Arbitro</span></p>
        </div>
    </div>

    <div th:if="${partite.empty}">
        <p>Nessuna partita programmata al momento.</p>
    </div>

    <a href="/" class="back-link">‹ Torna alla Home</a>
</body>
</html>

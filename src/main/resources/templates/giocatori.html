<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giocatori – Calcio Amatoriale</title>
    <meta name="description" content="Elenco completo di tutti i giocatori registrati nei tornei.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Header -->
        <div class="section-header anim-fade-up" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Giocatori</h1>
                <p>Tutti gli atleti registrati nei tornei.</p>
            </div>
            <a href="/admin/giocatore/new"
               sec:authorize="hasAuthority('ADMIN')"
               class="btn btn-primary">+ Nuovo Giocatore</a>
        </div>

        <!-- Search -->
        <form method="get" action="/giocatori" class="search-bar anim-fade-up anim-delay-1">
            <input type="text" name="search" placeholder="🔍 Cerca per nome o cognome…"
                   th:value="${param.search}">
            <button type="submit" class="btn btn-primary btn-sm">Cerca</button>
        </form>

        <!-- Tabella -->
        <div class="glass-panel anim-fade-up anim-delay-2" style="padding: 1rem;">
            <table id="giocatoriTable">
                <thead>
                    <tr>
                        <th>Giocatore</th>
                        <th>Ruolo</th>
                        <th>Squadra</th>
                        <th>Altezza</th>
                        <th sec:authorize="hasAuthority('ADMIN')">Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="g : ${giocatori}">
                        <td>
                            <div style="font-weight: 600; color: var(--text-primary);"
                                 th:text="${g.nome} + ' ' + ${g.cognome}">Nome</div>
                            <div style="font-size: 0.78rem; color: var(--text-muted);"
                                 th:text="'Nato il ' + ${#temporals.format(g.dataDiNascita, 'dd/MM/yyyy')}">Data</div>
                        </td>
                        <td><span class="badge badge-green" th:text="${g.ruolo}">Ruolo</span></td>
                        <td>
                            <a th:if="${g.squadra != null}"
                               th:href="@{'/squadra/' + ${g.squadra.id}}"
                               style="color: var(--green); font-weight: 500;"
                               th:text="${g.squadra.nome}">Squadra</a>
                            <span th:if="${g.squadra == null}"
                                  style="color: var(--text-muted); font-style: italic; font-size: 0.85rem;">Svincolato</span>
                        </td>
                        <td style="color: var(--text-muted);" th:text="${g.altezza} + ' cm'">180</td>
                        <td sec:authorize="hasAuthority('ADMIN')">
                            <div style="display: flex; gap: 0.4rem;">
                                <a th:href="@{'/admin/giocatore/' + ${g.id} + '/edit'}" class="btn btn-outline btn-sm">✏️</a>
                                <form th:action="@{'/admin/giocatore/' + ${g.id} + '/delete'}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm"
                                            onclick="return confirm('Eliminare il giocatore?')">🗑️</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(giocatori)}" class="empty-state" style="padding: 3rem;">
                <p>Nessun giocatore registrato nel sistema.</p>
            </div>
        </div>

    </main>


</body>
</html>

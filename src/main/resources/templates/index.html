<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcio Amatoriale - Home</title>
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-green: #2ecc71;
            --apple-gray: #f5f5f7;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-black);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.2rem;
            color: #86868b;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--apple-green);
            color: white;
        }

        .btn-primary:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        .btn-outline {
            border: 1px solid var(--apple-green);
            color: var(--apple-green);
        }

        .btn-outline:hover {
            background-color: rgba(46, 204, 113, 0.1);
            transform: scale(1.05);
        }

        .btn-guest {
            color: #0066cc;
            font-size: 0.9rem;
            margin-top: 20px;
            display: block;
        }

        .btn-guest:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calcio Amatoriale</h1>
    <p>La gestione dei tuoi tornei, con lo stile che meriti.</p>
    
    <div class="button-group">
        <a href="/login" class="btn btn-primary">Accedi</a>
        <a href="/register" class="btn btn-outline">Registrazione</a>
    </div>
    
    <a href="/esplora" class="btn btn-guest">Entra come Guest ›</a>
</div>

</body>
</html>

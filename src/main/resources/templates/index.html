<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcio Amatoriale - Home</title>
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-green: #2ecc71;
            --apple-gray: #f5f5f7;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-black);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.2rem;
            color: #86868b;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--apple-green);
            color: white;
        }

        .btn-primary:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }

        .btn-outline {
            border: 1px solid var(--apple-green);
            color: var(--apple-green);
        }

        .btn-outline:hover {
            background-color: rgba(46, 204, 113, 0.1);
            transform: scale(1.05);
        }

        .btn-guest {
            color: #0066cc;
            font-size: 0.9rem;
            margin-top: 20px;
            display: block;
        }

        .btn-guest:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calcio Amatoriale</h1>
    <p th:if="${messaggioSuccesso}" th:text="${messaggioSuccesso}" style="color: #2ecc71; font-weight: bold; font-size: 1.2rem; margin-top:-30px;"></p>
    <p>La gestione dei tuoi tornei, con lo stile che meriti.</p>
    
   <div class="button-group" style="margin-bottom: 15px;">
        <a href="/admin/torneo/new" class="btn btn-primary">Crea Torneo</a>
        <a href="/tornei" class="btn btn-outline">Esplora Tornei</a>
        <a href="/admin/iscrizione" class="btn btn-primary" style="background-color: #f39c12; margin-top: 10px;">Iscrivi Squadra a Torneo</a>
    </div>

    <div class="button-group">
        <a href="/admin/squadra/new" class="btn btn-primary" style="background-color: #0066cc;">Aggiungi Squadra</a>
        <a href="/squadre" class="btn btn-outline" style="border-color: #0066cc; color: #0066cc;">Lista Squadre</a>
    </div>

    <div class="button-group">
        <a href="/admin/giocatore/new" class="btn btn-primary" style="background-color: #e67e22;">Aggiungi Giocatore</a>
        <a href="/giocatori" class="btn btn-outline" style="border-color: #e67e22; color: #e67e22;">Lista Giocatori</a>
    </div>

    <div class="button-group">
        <a href="/admin/arbitro/new" class="btn btn-primary" style="background-color: #9b59b6;">Aggiungi Arbitro</a>
        <a href="/arbitri" class="btn btn-outline" style="border-color: #9b59b6; color: #9b59b6;">Lista Arbitri</a>
    </div>

    <div class="button-group">
        <a href="/admin/partita/new" class="btn btn-primary" style="background-color: #e74c3c;">Programma Partita</a>
        <a href="/partite" class="btn btn-outline" style="border-color: #e74c3c; color: #e74c3c;">Calendario Partite</a>
    </div>

</body>
</html>

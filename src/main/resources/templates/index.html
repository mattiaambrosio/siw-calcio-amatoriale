<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcio Amatoriale - Gestione Tornei</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
        }
        .hero-card {
            max-width: 650px;
            width: 100%;
            text-align: center;
            padding: 4rem 3rem;
            position: relative;
            z-index: 10;
        }
        .hero-card h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.8s ease-out;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--gray-medium);
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }
        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeUp 0.8s ease-out 0.4s both;
        }
        .home-buttons .btn {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
        }
        @media (min-width: 600px) {
            .home-buttons {
                flex-direction: row;
                justify-content: center;
            }
            .home-buttons .btn {
                width: auto;
                min-width: 180px;
            }
        }
        .auth-status {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
            animation: fadeUp 0.8s ease-out 0.6s both;
        }
    </style>
</head>

<body>
    <!-- Sfondo Animato Ambientale -->
    <div class="ambient-background"></div>

    <div class="glass-panel hero-card">
        <h1 class="text-gradient">⚽ Calcio Amatoriale</h1>
        <p class="subtitle">La piattaforma definitiva per gestire i tuoi tornei, le squadre e le partite con un'esperienza premium.</p>
        
        <div class="home-buttons">
            <a href="/tornei" class="btn btn-primary">🏆 Esplora Tornei</a>
            <div sec:authorize="!isAuthenticated()">
                <a href="/login" class="btn btn-secondary">Accedi</a>
                <a href="/register" class="btn btn-outline">Registrati</a>
            </div>
        </div>

        <div sec:authorize="isAuthenticated()" class="auth-status">
            <p>Sei già connesso alla piattaforma.</p>
            <a href="/dashboard" class="btn btn-outline" style="margin-top: 1rem;">Accedi al tuo pannello →</a>
        </div>
    </div>
</body>
</html>

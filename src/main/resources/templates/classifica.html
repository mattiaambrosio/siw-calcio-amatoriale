<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            padding: 2rem;
            max-width: 900px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin-bottom: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        thead {
            background: linear-gradient(90deg, var(--pitch-green) 0%, var(--pitch-green-light) 100%);
            color: var(--white-main);
        }
        thead th {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            color: var(--gray-dark);
        }
        tbody tr {
            transition: all 0.3s ease;
        }
        tbody tr:hover {
            background: rgba(46, 204, 113, 0.08);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .pos {
            font-weight: 800;
            color: var(--pitch-green-light);
            font-size: 1.1rem;
        }
        .team-name {
            text-align: left;
            font-weight: 600;
            color: var(--white-main);
        }
        .pts {
            font-weight: 800;
            color: var(--pitch-green-bright);
            background: rgba(46, 204, 113, 0.15);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="'📊 Classifica ' + ${torneo.nome}">Classifica</h1>
            <p style="color: var(--gray-medium); margin: 0;">Posizioni aggiornate in tempo reale</p>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">Pos</th>
                    <th style="text-align: left;">Squadra</th>
                    <th>G</th>
                    <th>V</th>
                    <th>N</th>
                    <th>P</th>
                    <th>PT</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry, iter : ${classifica}">
                    <td class="pos" th:text="${iter.count}">1</td>
                    <td class="team-name" th:text="${entry.squadra.nome}">Squadra</td>
                    <td th:text="${entry.giocate}">0</td>
                    <td th:text="${entry.vittorie}">0</td>
                    <td th:text="${entry.pareggi}">0</td>
                    <td th:text="${entry.sconfitte}">0</td>
                    <td class="pts" th:text="${entry.punti}">0</td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/tornei}" class="back-link" style="display: block; text-align: center; margin: 2rem 0;">← Torna ai Tornei</a>
    </div>
</body>
</html>

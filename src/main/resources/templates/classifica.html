<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .rank-medal { font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content" style="max-width: 960px;">

        <!-- Breadcrumb -->
        <div class="breadcrumb anim-fade-up">
            <a href="/tornei">Tornei</a>
            <span class="sep">/</span>
            <a th:href="@{'/torneo/' + ${torneo.id}}" th:text="${torneo.nome}">Torneo</a>
            <span class="sep">/</span>
            <span>Classifica</span>
        </div>

        <!-- Header -->
        <div class="section-header anim-fade-up">
            <h1>🏆 Classifica Ufficiale</h1>
            <p th:text="${torneo.nome} + ' · ' + ${torneo.anno}">Torneo 2026</p>
        </div>

        <!-- Tabella classifica -->
        <div class="glass-panel anim-fade-up anim-delay-1" style="padding: 0.5rem;">
            <table class="standings-table">
                <thead>
                    <tr>
                        <th style="width: 56px; text-align: center;">Pos</th>
                        <th>Squadra</th>
                        <th style="text-align: center;">PT</th>
                        <th style="text-align: center;">G</th>
                        <th style="text-align: center;">V</th>
                        <th style="text-align: center;">P</th>
                        <th style="text-align: center;">S</th>
                        <th style="text-align: center;">GF</th>
                        <th style="text-align: center;">GS</th>
                        <th style="text-align: center;">DR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry, stat : ${classifica}">
                        <td style="text-align: center; font-weight: 800;">
                            <span th:if="${stat.index == 0}" class="rank-medal rank-1">🥇</span>
                            <span th:if="${stat.index == 1}" class="rank-medal rank-2">🥈</span>
                            <span th:if="${stat.index == 2}" class="rank-medal rank-3">🥉</span>
                            <span th:if="${stat.index > 2}" style="color: var(--text-muted);"
                                  th:text="${stat.index + 1} + '°'">4°</span>
                        </td>
                        <td>
                            <a th:href="@{'/squadra/' + ${entry.squadra.id}}"
                               style="font-weight: 600; color: var(--text-primary);"
                               th:text="${entry.squadra.nome}">Squadra</a>
                        </td>
                        <td style="text-align: center; font-weight: 700; color: var(--green);"
                            th:text="${entry.punti}">0</td>
                        <td style="text-align: center; color: var(--text-muted);" th:text="${entry.giocate}">0</td>
                        <td style="text-align: center; color: var(--green);" th:text="${entry.vittorie}">0</td>
                        <td style="text-align: center;" th:text="${entry.pareggi}">0</td>
                        <td style="text-align: center; color: var(--red);" th:text="${entry.sconfitte}">0</td>
                        <td style="text-align: center;" th:text="${entry.golFatti}">0</td>
                        <td style="text-align: center;" th:text="${entry.golSubiti}">0</td>
                        <td style="text-align: center; font-weight: 600;"
                            th:text="${entry.golFatti - entry.golSubiti}">0</td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(classifica)}" class="empty-state" style="padding: 3rem;">
                <p>Nessuna squadra iscritta a questo torneo.</p>
            </div>
        </div>

        <!-- Legend -->
        <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1rem;" class="anim-fade-up anim-delay-2">
            <span style="font-size: 0.78rem; color: var(--text-muted);">PT = Punti</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">G = Giocate</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">V = Vittorie</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">P = Pareggi</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">S = Sconfitte</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">GF = Gol Fatti</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">GS = Gol Subiti</span>
            <span style="font-size: 0.78rem; color: var(--text-muted);">DR = Diff. Reti</span>
        </div>

    </main>
</body>
</html>

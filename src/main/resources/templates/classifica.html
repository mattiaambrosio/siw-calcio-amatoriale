<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            padding: 2rem;
            max-width: 900px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin-bottom: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        thead {
            background: linear-gradient(90deg, var(--pitch-green) 0%, var(--pitch-green-light) 100%);
            color: var(--white-main);
        }
        thead th {
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody td {
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            color: var(--gray-dark);
        }
        tbody tr {
            transition: all 0.3s ease;
        }
        tbody tr:hover {
            background: rgba(46, 204, 113, 0.08);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .pos {
            font-weight: 800;
            color: var(--pitch-green-light);
            font-size: 1.1rem;
        }
        .team-name {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre">Squadre</a></li>
            <li><a href="/giocatori">Giocatori</a></li>
            <li sec:authorize="isAuthenticated()"><a href="/dashboard">Area Personale</a></li>
        </ul>
    </nav>

    <main class="container">
        <header style="margin-bottom: 3rem;">
            <div class="breadcrumb" style="margin-bottom: 1rem;"><a th:href="@{'/torneo/' + ${torneo.id}}" style="color: var(--accent-green); text-decoration: none;">← Torna al Torneo</a></div>
            <h1 class="text-gradient" style="font-size: 3rem;">Classifica Ufficiale</h1>
            <p style="color: var(--gray-medium);" th:text="${torneo.nome} + ' ' + ${torneo.anno}">Torneo</p>
        </header>

        <section class="glass-panel" style="padding: 1rem;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">Pos</th>
                        <th>Squadra</th>
                        <th style="text-align: center;">PT</th>
                        <th style="text-align: center;">G</th>
                        <th style="text-align: center;">V</th>
                        <th style="text-align: center;">P</th>
                        <th style="text-align: center;">S</th>
                        <th style="text-align: center;">GF</th>
                        <th style="text-align: center;">GS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry, stat : ${classifica}">
                        <td style="font-weight: 800; font-family: 'Outfit';">
                            <span th:if="${stat.index == 0}" style="color: var(--accent-green);">1°</span>
                            <span th:if="${stat.index > 0}" th:text="${stat.index + 1} + '°'">2°</span>
                        </td>
                        <td>
                            <a th:href="@{'/squadra/' + ${entry.squadra.id}}" style="color: #fff; text-decoration: none; font-weight: 600;" th:text="${entry.squadra.nome}">Squadra</a>
                        </td>
                        <td style="text-align: center; font-weight: 700; color: var(--accent-green);" th:text="${entry.punti}">0</td>
                        <td style="text-align: center; color: var(--gray-medium);" th:text="${entry.giocate}">0</td>
                        <td style="text-align: center;" th:text="${entry.vittorie}">0</td>
                        <td style="text-align: center;" th:text="${entry.pareggi}">0</td>
                        <td style="text-align: center;" th:text="${entry.sconfitte}">0</td>
                        <td style="text-align: center;" th:text="${entry.golFatti}">0</td>
                        <td style="text-align: center;" th:text="${entry.golSubiti}">0</td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(classifica)}" style="text-align: center; padding: 2rem; color: var(--gray-medium); font-style: italic;">
                Nessuna squadra iscritta a questo torneo.
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadre Iscritte - Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .container {
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            margin-bottom: 0.5rem;
        }
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        .team-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--pitch-green-light);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .team-card:hover {
            border-top-color: var(--pitch-green-bright);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
            transform: translateY(-4px);
        }
        .team-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white-main);
            margin: 0 0 1rem 0;
        }
        .team-info {
            margin-bottom: 1.5rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: var(--white-main);
        }
        .info-value {
            color: var(--gray-dark);
        }
        .roster-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }
        .roster-title {
            color: var(--pitch-green-light);
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            color: var(--gray-dark);
            border-bottom: 1px solid rgba(46, 204, 113, 0.1);
        }
        .player-item:last-child {
            border-bottom: none;
        }
        .player-name {
            font-weight: 500;
            color: var(--white-main);
        }
        .player-role {
            color: var(--gray-medium);
            font-size: 0.85rem;
        }
        .empty-roster {
            color: var(--gray-medium);
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem 0;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray-medium);
        }
        .empty-state h2 {
            color: var(--gray-dark);
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .teams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tornei">Tornei</a></li>
            <li><a href="/squadre" class="active">Squadre</a></li>
            <li><a href="/giocatori">Giocatori</a></li>
            <li sec:authorize="isAuthenticated()"><a href="/dashboard">Area Personale</a></li>
        </ul>
    </nav>

    <main class="container">
        <header style="margin-bottom: 3rem;">
            <h1 class="text-gradient" style="font-size: 3rem;">Club & Squadre</h1>
            <p style="color: var(--gray-medium);">I protagonisti dei nostri campionati.</p>
        </header>

        <!-- Barra di ricerca -->
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; justify-content: center;">
            <input type="text" id="searchSquadre" placeholder="🔍 Cerca una squadra..." style="
                padding: 0.8rem 1.2rem;
                border-radius: 10px;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.1);
                color: #fff;
                font-size: 0.95rem;
                width: 100%;
                max-width: 400px;
                outline: none;
                transition: border-color 0.2s;
            " />
            <button id="clearSearch" style="display:none; padding: 0.8rem 1.2rem; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-weight: 600;">✕ Cancella</button>
        </div>

        <div class="grid-3">
            <div th:each="squadra : ${squadre}" class="card glass-panel" style="padding: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div style="width: 50px; height: 50px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">🛡️</div>
                    <span style="color: var(--gray-medium); font-size: 0.8rem;" th:text="'Fond. ' + ${squadra.annoDiFondazione}">1900</span>
                </div>
                <h2 style="margin-bottom: 0.5rem;" th:text="${squadra.nome}">Nome Squadra</h2>
                <p style="color: var(--accent-green); font-size: 0.85rem; font-weight: 600; margin-bottom: 1.5rem;" th:text="${squadra.citta}">Città</p>
                
                <a th:href="@{'/squadra/' + ${squadra.id}}" class="btn btn-outline" style="width: 100%;">Esplora Rosa</a>
            </div>
        </div>
        </div>
    </div>

    <a href="/" class="back-link" style="display: block; margin: 2rem; text-align: center;">← Torna alla Home</a>

    <script>
        // Ricerca in tempo reale per le squadre
        const searchInput = document.getElementById('searchSquadre');
        const clearBtn = document.getElementById('clearSearch');
        const cards = document.querySelectorAll('.grid-3 > .card');

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            clearBtn.style.display = searchTerm ? 'block' : 'none';
            
            let visibleCount = 0;
            cards.forEach(card => {
                const nome = card.querySelector('h2')?.textContent.toLowerCase() || '';
                const citta = card.querySelector('p')?.textContent.toLowerCase() || '';
                const match = nome.includes(searchTerm) || citta.includes(searchTerm);
                card.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            // Mostra messaggio se nessuna squadra trovata
            if (visibleCount === 0 && searchTerm) {
                if (!document.getElementById('noResults')) {
                    const msg = document.createElement('div');
                    msg.id = 'noResults';
                    msg.style.cssText = 'text-align: center; padding: 3rem; color: var(--gray-medium); font-style: italic;';
                    msg.textContent = '❌ Nessuna squadra trovata';
                    document.querySelector('.grid-3').parentElement.appendChild(msg);
                }
            } else {
                const noResults = document.getElementById('noResults');
                if (noResults) noResults.remove();
            }
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        });
    </script>
</body>
</html>

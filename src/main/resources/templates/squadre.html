<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadre – Calcio Amatoriale</title>
    <meta name="description" content="Elenco di tutte le squadre iscritte ai tornei di calcio amatoriale.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <main class="container page-content">

        <!-- Header -->
        <div class="section-header anim-fade-up" style="display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Squadre</h1>
                <p>Esplora i club partecipanti ai nostri tornei.</p>
            </div>
            <a href="/admin/squadra/new"
               sec:authorize="hasAuthority('ADMIN')"
               class="btn btn-primary">+ Nuova Squadra</a>
        </div>

        <!-- Search -->
        <form method="get" action="/squadre" class="search-bar anim-fade-up anim-delay-1">
            <input type="text" name="search" placeholder="🔍 Cerca per nome…"
                   th:value="${param.search}">
            <button type="submit" class="btn btn-primary btn-sm">Cerca</button>
        </form>

        <!-- Grid squadre -->
        <div class="grid-3 anim-fade-up anim-delay-2" id="squadreGrid">
            <div th:each="squadra : ${squadre}" class="card card-green">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
                    <div style="width: 44px; height: 44px; background: var(--green-dim); border: 1px solid var(--green-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">🛡️</div>
                    <span style="font-size: 0.8rem; color: var(--text-muted);"
                          th:text="'Fond. ' + ${squadra.annoDiFondazione}">1900</span>
                </div>
                <h2 style="font-size: 1.15rem; margin-bottom: 0.3rem;" th:text="${squadra.nome}">Nome</h2>
                <p style="font-size: 0.875rem; color: var(--green); font-weight: 600; margin-bottom: 1.5rem;"
                   th:text="${squadra.citta}">Città</p>
                <a th:href="@{'/squadra/' + ${squadra.id}}" class="btn btn-outline" style="width: 100%;">Esplora Rosa →</a>
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(squadre)}" class="empty-state">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛡️</div>
            <h3>Nessuna squadra registrata</h3>
            <p>Non ci sono ancora squadre nel sistema.</p>
            <a href="/admin/squadra/new" sec:authorize="hasAuthority('ADMIN')" class="btn btn-primary" style="margin-top: 1.5rem;">+ Aggiungi Squadra</a>
        </div>

    </main>

</body>
</html>

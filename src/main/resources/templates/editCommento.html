<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Commento – Calcio Amatoriale</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="ambient-glow"></div>
    <nav th:replace="~{fragments/layout :: nav}"></nav>

    <div class="form-page">
        <div class="form-card anim-fade-up">

            <!-- Breadcrumb -->
            <div class="breadcrumb" style="margin-bottom: 1.5rem;">
                <a th:href="@{'/partita/' + ${commento.partita.id}}">← Torna alla Partita</a>
            </div>

            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">✏️ Modifica Commento</h1>
            <p style="margin-bottom: 1.75rem; font-size: 0.875rem;">Puoi modificare solo i tuoi commenti.</p>

            <form th:action="@{'/commento/' + ${commento.id} + '/edit'}" method="post">
                <div class="form-group">
                    <label for="testo">Il tuo commento</label>
                    <textarea id="testo" name="testo" th:text="${commento.testo}"
                              required maxlength="1000"
                              placeholder="Scrivi qui il tuo commento…"
                              style="min-height: 140px;"></textarea>
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Salva Modifiche</button>
                    <a th:href="@{'/partita/' + ${commento.partita.id}}" class="btn btn-secondary" style="flex: 1; text-align: center;">Annulla</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
